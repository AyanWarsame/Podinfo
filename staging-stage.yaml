apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: podinfo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: podinfo
      sources:
        direct: true

  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/AyanWarsame/Podinfo.git
            checkout:
              - branch: main
                path: repo

        - uses: kustomize-set-image
          config:
            path: repo/staging
            images:
              - image: ghcr.io/stefanprodan/podinfo
                tag: ${{ imageFrom("ghcr.io/stefanprodan/podinfo", warehouse("podinfo")).Tag }}

        - uses: git-commit
          config:
            path: repo
            message: "update staging image"

        - uses: git-push
          config:
            path: repo
            targetBranch: main

        - uses: argocd-update
          config:
            apps:
              - name: podinfo-staging
                namespace: argocd
